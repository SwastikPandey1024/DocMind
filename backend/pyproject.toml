[project]
name = "docuchat-ai-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for DocuChat"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "python-jose[cryptography]>=3.3.0",
  "pwdlib[argon2]>=0.3.0",
  "email-validator>=2.0.0",
  "pytest>=9.0.0",
  "httpx>=0.28.0"
]
