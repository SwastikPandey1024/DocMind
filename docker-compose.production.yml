version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docmind-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docmind}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - docmind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_REGISTRY:-docker.io}/docmind-backend:${VERSION:-latest}
    container_name: docmind-backend-prod
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-docmind}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-small}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
    volumes:
      - storage_uploads_prod:/app/storage/uploads
      - storage_vectorstore_prod:/app/storage/vectorstore
      - storage_logs_prod:/app/storage/logs
    networks:
      - docmind
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKER_REGISTRY:-docker.io}/docmind-frontend:${VERSION:-latest}
    container_name: docmind-frontend-prod
    restart: always
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    networks:
      - docmind
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: docmind-ollama-prod
    restart: always
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data_prod:/root/.ollama
    networks:
      - docmind
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_prod:
  ollama_data_prod:
  storage_uploads_prod:
  storage_vectorstore_prod:
  storage_logs_prod:

networks:
  docmind:
    driver: bridge
